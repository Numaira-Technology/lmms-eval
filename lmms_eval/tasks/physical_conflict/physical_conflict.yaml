dataset_path: physical_conflict
class: !function utils.PhysicalConflictTask
task: physical_conflict
test_split: test
output_type: generate_until
doc_to_visual: !function utils.physical_conflict_doc_to_visual
doc_to_text: !function utils.physical_conflict_doc_to_text
doc_to_target: !function utils.physical_conflict_doc_to_target
process_docs: !function utils.physical_conflict_process_docs
process_results: !function utils.physical_conflict_process_results
metric_list:
  - metric: Overall_Exact_Accuracy
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: SingleChoice_Accuracy
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: Binary_Accuracy
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: MultipleChoice_Exact_Set_Accuracy
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: MultipleChoice_Macro_Precision
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: MultipleChoice_Macro_Recall
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: Numeric_Accuracy_at_0_5s
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: true
  - metric: Numeric_Option_MAE
    aggregation: !function utils.physical_conflict_aggregate_mean
    higher_is_better: false
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    single_choice_post_prompt: "Answer with only one option letter."
    multiple_choice_post_prompt: 'Return only a JSON array of option IDs, for example ["A","C"].'
dataset_kwargs:
  cache_dir: physical_conflict
  video: true
  qa_filename: clean_samples_1000_human_reviewed_with_qa.jsonl
  split_filename: splits/test.jsonl
metadata:
  version: 0.0
  cache_dir: physical_conflict
  video_root_env: PHYSICAL_CONFLICT_VIDEO_ROOT
  qa_path_env: PHYSICAL_CONFLICT_QA_PATH
  split_path_env: PHYSICAL_CONFLICT_SPLIT_PATH
